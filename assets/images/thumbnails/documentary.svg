<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#131929"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EAB308" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#EAB308" stop-opacity="0.03"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- Subtle gradient overlay -->
  <rect width="800" height="450" fill="url(#shine)"/>
  <!-- Border -->
  <rect x="1" y="1" width="798" height="448" fill="none" stroke="#EAB308" stroke-width="1" stroke-opacity="0.3"/>
  <!-- Grid lines (decorative) -->
  <line x1="0" y1="150" x2="800" y2="150" stroke="#EAB308" stroke-opacity="0.05" stroke-width="1"/>
  <line x1="0" y1="300" x2="800" y2="300" stroke="#EAB308" stroke-opacity="0.05" stroke-width="1"/>
  <line x1="266" y1="0" x2="266" y2="450" stroke="#EAB308" stroke-opacity="0.05" stroke-width="1"/>
  <line x1="533" y1="0" x2="533" y2="450" stroke="#EAB308" stroke-opacity="0.05" stroke-width="1"/>
  <!-- Icon circle -->
  <circle cx="400" cy="185" r="52" fill="#EAB308" fill-opacity="0.12"/>
  <circle cx="400" cy="185" r="52" fill="none" stroke="#EAB308" stroke-width="1.5" stroke-opacity="0.5"/>
  <!-- Icon (scaled/centered 24px viewbox → 40px rendered) -->
  <g transform="translate(380, 165) scale(1.667)" stroke="#EAB308" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
  </g>
  <!-- Category label -->
  <text x="400" y="280" font-family="'Outfit', 'Inter', sans-serif" font-size="11" font-weight="600"
        fill="#EAB308" fill-opacity="0.9" text-anchor="middle" letter-spacing="4">DOCUMENTARY</text>
  <!-- Separator -->
  <rect x="340" y="296" width="120" height="1" fill="#EAB308" fill-opacity="0.2"/>
  <!-- Brand -->
  <text x="400" y="320" font-family="'Outfit', 'Inter', sans-serif" font-size="12" font-weight="400"
